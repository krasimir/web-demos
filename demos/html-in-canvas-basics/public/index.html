<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HTML in canvas — the basics</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <label class="tilt-control">
    Tilt
    <input type="range" id="tilt" min="-45" max="45" value="15">
  </label>

  <canvas layoutsubtree>
    <div class="content">
      <h1>Hello, Canvas</h1>
      <p>This text is an ordinary DOM element, drawn live into a canvas via the HTML in Canvas API and tilted in 3D by a WebGL vertex shader.</p>
    </div>
  </canvas>

  <script src="app.js" defer></script>
</body>
</html>
