<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HTML in canvas — the basics</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="controls">
    <label class="tilt-control">
      Rotate
      <input type="range" id="tilt" min="0" max="360" value="270">
    </label>
    <label class="tilt-control">
      Title
      <input type="text" id="title-input" value="Hello, Canvas">
    </label>
  </div>

  <canvas layoutsubtree>
    <div class="content">
      <h1>Hello, Canvas</h1>
    </div>
  </canvas>

  <script src="app.js" defer></script>
</body>
</html>
