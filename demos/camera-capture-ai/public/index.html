<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Camera Capture Demo</title>
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 40px auto; }
  .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  select, button { padding: 8px 12px; font-size: 14px; }
  button { cursor: pointer; }
  .views { display: grid; gap: 16px; grid-template-columns: 3fr 1fr; }
  .views figure { margin: 0; position: relative; }
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: transparent; border: none; }
  .views figcaption { font-size: 13px; color: #666; margin-top: 6px; }
  video, canvas { width: 100%; height: auto; background: #111; border: 1px solid #ccc; display: block; }
  #status { min-height: 20px; font-weight: bold; margin-bottom: 12px; }
  #download-link { display: none; margin-top: 8px; }
  #smile-panel { margin-top: 24px; }
  #smile-status { font-size: 15px; }
  .face-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .face-bar { width: 240px; height: 30px; background: #eee; border-radius: 5px; overflow: hidden; }
  .face-bar-fill { height: 100%; background: #4caf50; }
  #smile-status { font-size: 3em;}
</style>
</head>
<body>
  <div class="controls">
    <select id="camera-select"></select>
    <button id="capture-btn">Capture photo</button>
  </div>

  <div id="status"></div>

  <div class="views">
    <figure>
      <video id="preview" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <figcaption>Live preview</figcaption>
    </figure>
    <figure>
      <canvas id="snapshot"></canvas>
      <figcaption>Captured photo</figcaption>
      <a id="download-link" download="photo.png">Download photo</a>
    </figure>
  </div>

  <div id="smile-panel">
    <h2>Smile detector</h2>
    <div id="smile-status">Loading model...</div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
