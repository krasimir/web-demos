<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Asteroid Run</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05060a">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asteroid Run">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
  #game { display: block; width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; background: #000; touch-action: none; }

  #hud { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); color: #eee; font-family: 'Courier New', monospace; font-size: 20px; text-shadow: 0 0 6px rgba(0,0,0,0.8); pointer-events: none; }
  #hud .label { color: #6cf; }

  #fullscreen-btn { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); background: rgba(255,255,255,0.08); color: #eee; border: 1px solid #456; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 14px; padding: 8px 12px; cursor: pointer; }
  #fullscreen-btn:hover { background: rgba(255,255,255,0.16); }

  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #eee; font-family: 'Courier New', monospace; background: rgba(0,0,0,0.6); }
  .overlay h1 { font-size: 42px; letter-spacing: 4px; color: #6cf; text-shadow: 0 0 16px rgba(108,204,255,0.6); margin: 0 0 8px; }
  .overlay p { color: #aab; margin: 4px 0; font-size: 15px; }
  .overlay .score { font-size: 22px; color: #fff; margin: 16px 0; }
  .overlay button { margin-top: 20px; background: #1a3a52; color: #6cf; border: 1px solid #6cf; border-radius: 6px; font-family: inherit; font-size: 16px; padding: 10px 24px; cursor: pointer; }
  .overlay button:hover { background: #244e6e; }
  .hidden { display: none !important; }
  .version-tag { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); font-size: 11px; color: #567; margin: 0; }

  #install-banner { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); z-index: 6; display: none; justify-content: center; padding: 0 10px; }
  #install-banner.visible { display: flex; }
  #install-banner .inner { display: flex; align-items: center; gap: 10px; max-width: 480px; background: rgba(20, 20, 20, 0.9); border: 1px solid rgba(255,255,255,0.15); color: #eee; font-family: sans-serif; font-size: 12.5px; line-height: 1.3; border-radius: 10px; padding: 8px 10px; }
  #install-banner .install-icon { font-size: 20px; flex-shrink: 0; }
  #install-banner .install-text { flex: 1; }
  #install-banner .install-text b { color: #fff; }
  #install-banner button { border: none; border-radius: 6px; font-family: sans-serif; font-size: 12px; cursor: pointer; }
  #install-banner .install-action { background: #4caf50; color: #fff; padding: 6px 10px; font-weight: 600; flex-shrink: 0; }
  #install-banner .install-dismiss { background: transparent; color: #999; padding: 4px 6px; font-size: 16px; flex-shrink: 0; }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <span class="label">SCORE</span> <span id="score">0</span>
  </div>

  <button id="fullscreen-btn">⛶ Fullscreen</button>

  <div id="start-overlay" class="overlay">
    <h1>ASTEROID RUN</h1>
    <p>Steer your ship through the asteroid field.</p>
    <p id="instructions">Arrow keys / WASD to move. Survive as long as you can.</p>
    <button id="start-btn">Launch</button>
    <p class="version-tag">Build __BUILD_ID__</p>
  </div>

  <div id="gameover-overlay" class="overlay hidden">
    <h1>SHIP LOST</h1>
    <div class="score">Score: <span id="final-score">0</span></div>
    <button id="retry-btn">Try Again</button>
  </div>

  <div id="install-banner">
    <div class="inner">
      <div class="install-icon">📲</div>
      <div class="install-text" id="install-text"></div>
      <button class="install-action" id="install-action" type="button" hidden>Install</button>
      <button class="install-dismiss" id="install-dismiss" type="button" aria-label="Dismiss">✕</button>
    </div>
  </div>

  <script src="install-prompt.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
