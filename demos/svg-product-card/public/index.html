<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Single-file SVG: image + text, row to column</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    padding: 3rem 1.25rem;
    box-sizing: border-box;
    background: radial-gradient(circle at 20% 0%, #1b1440, #050410 60%);
    color: #f4f2ff;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
</style>
</head>
<body>
  <img src="card.svg" width="580" height="513" alt="Image and text demo that reflows from a row to a column" />
</body>
</html>
