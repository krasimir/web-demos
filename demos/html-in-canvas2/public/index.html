<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HTML in canvas — glitch validation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas layoutsubtree>
    <div class="content">
      <div class="card">
        <form>
          <label>
            Name
            <input type="text" name="name" placeholder="Jane Doe">
          </label>
          <label>
            Email
            <input type="email" name="email" placeholder="jane@example.com">
          </label>
          <label>
            Phone
            <input type="tel" name="phone" placeholder="1234567">
          </label>
          <button type="submit">Submit</button>
        </form>
      </div>
    </div>
  </canvas>

  <script src="app.js" defer></script>
</body>
</html>
