<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HTML in canvas — ripple form</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas layoutsubtree>
    <div class="content">
      <div class="card">
        <p>This demo shows how to implement a trail ripple effect with a shader on real HTML elements, like an input and a button, by using the HTML in Canvas API.</p>
        <form>
          <input type="text" placeholder="name">
          <button>Submit</button>
        </form>
      </div>
    </div>
  </canvas>

  <script src="app.js" defer></script>
</body>
</html>
