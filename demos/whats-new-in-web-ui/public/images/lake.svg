<style><![CDATA[
  /* Media queries use the SVG viewport when loaded as an image. */
  .compact-only { display:none; }
  .desktop-only { display:inline; }
  .headline { font: 900 68px system-ui, sans-serif; letter-spacing: 3px; fill:#103945; }
  .subtitle { font: 700 19px system-ui, sans-serif; letter-spacing: 7px; fill:#225565; }
  .stat-number { font: 800 26px system-ui, sans-serif; fill:#143f48; }
  .stat-label { font: 700 12px system-ui, sans-serif; letter-spacing:1px; fill:#52747b; }
  #sun { transition:fill .25s; }
  @media (max-width: 700px) {
    .desktop-only { display:none; }
    .compact-only { display:inline; }
    .headline { font-size: 82px; }
    #sun { fill:#ffbf4a; }
    #scene { transform: translateY(65px) scale(1.04); transform-origin: 500px 340px; }
    #header { transform:translateY(75px); }
  }
  @media (max-width: 420px) {
    .headline { font-size: 100px; }
    #header { transform:translateY(110px); }
    #scene { transform:translateY(115px) scale(1.25); transform-origin: 500px 350px; }
    .medium-only { display:none; }
  }
]]></style>
