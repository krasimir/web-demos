<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Smile Jump</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#222222">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Smile Jump">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #222;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #game-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #game {
    display: block;
    image-rendering: pixelated;
    background: #fff;
  }

  .hud {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    right: env(safe-area-inset-right, 0px);
    margin: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 5;
    background: rgba(0,0,0,0.35);
    border-radius: 10px;
    padding: 6px 10px;
  }

  video {
    width: 64px;
    height: 48px;
    border-radius: 6px;
    transform: scaleX(-1);
    object-fit: cover;
  }

  .smile-bar {
    width: 64px;
    height: 10px;
    background: #444;
    border-radius: 5px;
    overflow: hidden;
  }
  .smile-bar-fill {
    height: 100%;
    width: 0%;
    background: #4caf50;
    transition: width 0.05s linear;
  }

  #status {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 0px);
    left: 0;
    right: 0;
    text-align: center;
    color: #eee;
    font-family: sans-serif;
    font-size: 13px;
    padding: 10px;
    z-index: 5;
    pointer-events: none;
  }

  #install-banner {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 30px);
    z-index: 6;
    display: none;
    justify-content: center;
    padding: 0 10px;
  }
  #install-banner.visible { display: flex; }

  #install-banner .inner {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 480px;
    background: rgba(20, 20, 20, 0.9);
    border: 1px solid rgba(255,255,255,0.15);
    color: #eee;
    font-family: sans-serif;
    font-size: 12.5px;
    line-height: 1.3;
    border-radius: 10px;
    padding: 8px 10px;
  }

  #install-banner .install-icon { font-size: 20px; flex-shrink: 0; }
  #install-banner .install-text { flex: 1; }
  #install-banner .install-text b { color: #fff; }

  #install-banner button {
    border: none;
    border-radius: 6px;
    font-family: sans-serif;
    font-size: 12px;
    cursor: pointer;
  }
  #install-banner .install-action {
    background: #4caf50;
    color: #fff;
    padding: 6px 10px;
    font-weight: 600;
    flex-shrink: 0;
  }
  #install-banner .install-dismiss {
    background: transparent;
    color: #999;
    padding: 4px 6px;
    font-size: 16px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

  <div id="game-wrap">
    <canvas id="game" width="320" height="180"></canvas>
  </div>

  <div class="hud">
    <video id="camera" autoplay playsinline muted></video>
    <div class="smile-bar"><div id="smile-bar-fill" class="smile-bar-fill"></div></div>
  </div>

  <div id="status"></div>

  <div id="install-banner">
    <div class="inner">
      <div class="install-icon">📲</div>
      <div class="install-text" id="install-text"></div>
      <button class="install-action" id="install-action" type="button" hidden>Install</button>
      <button class="install-dismiss" id="install-dismiss" type="button" aria-label="Dismiss">✕</button>
    </div>
  </div>

  <script src="install-prompt.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
