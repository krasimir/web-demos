<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smile Jump</title>
<style>
  body { font-family: sans-serif; background: #222; color: #eee; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 24px; }
  h1 { margin: 0 0 4px; }
  p { margin: 0 0 16px; color: #aaa; }
  #game { image-rendering: pixelated; border: 2px solid #555; background: #fff; }
  .camera-box { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  video { width: 160px; height: 120px; border: 1px solid #555; transform: scaleX(-1); }
  .smile-bar { width: 160px; height: 14px; background: #444; border-radius: 7px; overflow: hidden; }
  .smile-bar-fill { height: 100%; width: 0%; background: #4caf50; }
  #status { min-height: 20px; }
</style>
</head>
<body>
  <h1>Smile Jump</h1>
  <p>Smile to jump. The bigger the smile, the higher the jump.</p>

  <canvas id="game" width="320" height="180" style="width: 800px; height: 450px;"></canvas>

  <div class="camera-box">
    <video id="camera" autoplay playsinline muted></video>
    <div>
      <div class="smile-bar"><div id="smile-bar-fill" class="smile-bar-fill"></div></div>
      <div id="status"></div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
